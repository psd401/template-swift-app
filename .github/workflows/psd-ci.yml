# CI for Swift repos.
#
# Swift repos don't call PSD401/.github reusable-psd-ci.yml: that workflow runs
# on ubuntu, and Swift/macOS builds need a macOS runner. The gates (build, test,
# lint) live in psd-ci-swift.yml, a local reusable workflow, and this job calls
# it. Calling it through a job named psd-ci makes the check context
# "psd-ci / psd-ci", the same context every other PSD401 repo reports and the
# only one the org rulesets require (psd-dev-standards rulesets/, 2026-10-10).
# A direct job would report plain "psd-ci", which the rulesets don't accept.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  psd-ci:
    uses: ./.github/workflows/psd-ci-swift.yml
