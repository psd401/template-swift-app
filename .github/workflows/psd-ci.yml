# CI for Swift repos (psd-dev-standards standards/06 §2, repo-specific gate jobs; psd401/psd-dev-standards#80).
#
# The org reusable CI (PSD401/.github reusable-psd-ci.yml) runs on ubuntu, and
# Swift/macOS builds need a macOS runner. So the gates (build, test, lint) run
# here in job swift on macos-15, and job psd-ci calls the org reusable with
# swift's result: the reusable fails unless swift succeeded, and runs the org
# runtime-standard step. The caller job id psd-ci plus the reusable's job name
# psd-ci make the check context "psd-ci / psd-ci", the only one the org
# rulesets require (psd-dev-standards rulesets/, 2026-10-10). Don't rename
# job psd-ci or give it steps: a plain job reports plain "psd-ci".
name: CI

on:
  # pull_request only: a check doesn't re-run after the merge (psd-dev-standards standards/06 §4, Runner minutes).
  pull_request:

permissions:
  contents: read

# A new push to the PR cancels the run it supersedes (standards/06 §4).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Docs-only skip (psd-dev-standards standards/06 §4, Runner minutes): a PR
  # is docs-only when every changed file is Markdown (**/*.md) or
  # openwiki/.last-update.json. One other file and the gates run. If tests
  # ever read .md fixtures, make those paths count as code in the case below.
  # This runs on Linux (~$0.006/min) so a docs-only PR never starts a macOS
  # runner (~$0.062/min).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR merge commit and its first parent, the base branch.
          fetch-depth: 2
          persist-credentials: false

      - name: List changed files
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          docs_only=false
          if [ "$EVENT_NAME" = pull_request ]; then
            docs_only=true
            files=$(git diff --name-only HEAD^1 HEAD)
            printf '%s\n' "$files"
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              case "$f" in
                *.md|openwiki/.last-update.json) ;;
                *) docs_only=false ;;
              esac
            done <<< "$files"
          fi
          echo "docs_only=$docs_only" | tee -a "$GITHUB_OUTPUT"

  # The gates. A docs-only PR skips them inside the job, never with a
  # job-level if: the org reusable fails on a skipped upstream job
  # (standards/06 §2). Such a run takes a Linux runner and runs one echo step.
  # If the changes job fails, its output is empty and the gates run on macOS;
  # !cancelled() keeps that case from skipping this job.
  swift:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.changes.outputs.docs_only == 'true' && 'ubuntu-latest' || 'macos-15' }}
    timeout-minutes: 30
    steps:
      - name: Docs-only change, gates not needed
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Docs-only change; the Swift gates do not run."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.docs_only != 'true'

      - name: Toolchain versions (evidence)
        if: needs.changes.outputs.docs_only != 'true'
        run: swift --version

      - name: Build
        if: needs.changes.outputs.docs_only != 'true'
        run: swift build

      - name: Test
        if: needs.changes.outputs.docs_only != 'true'
        run: swift test

      # The runner-images README lists SwiftLint for macos-15, but the
      # deployed image does not have it on PATH (verified: run 31853132495
      # failed with `swiftlint: command not found`). Install via brew.
      - name: Install SwiftLint
        if: needs.changes.outputs.docs_only != 'true'
        run: brew install swiftlint

      - name: Lint
        if: needs.changes.outputs.docs_only != 'true'
        run: swiftlint lint --strict --reporter github-actions-logging

  # The required check. if: always() makes it run, and fail, when swift
  # fails or is skipped; without it a failed upstream job would skip this
  # one, and a skipped required check counts as passing. gate: off because
  # every gate runs in swift (the reusable's own gate is for JS/Python).
  psd-ci:
    if: always()
    needs: [swift]
    permissions:
      contents: read
    uses: PSD401/.github/.github/workflows/reusable-psd-ci.yml@53bd9c84e4630cbe0a8cf32c18eb1227b5f70ae5 # v1.14.1
    with:
      upstream-results: ${{ join(needs.*.result, ' ') }}
      gate: "off"
